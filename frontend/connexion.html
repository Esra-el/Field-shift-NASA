<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E6E7DE" />
  <title>Field Shift — Connexion</title>
  <meta name="description" content="Connectez-vous à votre espace Field Shift." />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=BDO+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css?v=1" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body>
  <main class="lg">
    <section class="lg-card">
      <a class="lg-logo" href="/"><span class="lg-mark"><iconify-icon icon="lucide:sprout" width="20" height="20"></iconify-icon></span>Field Shift</a>
      <div class="lg-lang" role="group" aria-label="Langue · Language · Lingua">
        <button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button><button type="button" data-l="it">IT</button>
      </div>

      <h1 data-t="lg.title"></h1>
      <p class="lg-sub" data-t="lg.sub"></p>

      <div class="lg-known hidden" id="lg-known">
        <span class="lg-avatar"><iconify-icon icon="lucide:user" width="18" height="18"></iconify-icon></span>
        <div><small data-t="lg.known"></small><b id="lg-known-name"></b></div>
        <a class="lg-btn" href="/inicio.html" data-t="lg.continue"></a>
      </div>

      <form class="lg-form" id="lg-form" novalidate>
        <label><span data-t="lg.name"></span><input id="lg-name" autocomplete="name" required /></label>
        <label><span data-t="lg.contact"></span><input id="lg-contact" autocomplete="email" inputmode="email" data-t-ph="lg.contact_ph" /></label>
        <p class="lg-err hidden" id="lg-err" data-t="lg.err"></p>
        <button type="submit" class="lg-btn lg-btn-full"><span data-t="lg.submit"></span><iconify-icon icon="lucide:arrow-right" width="18" height="18"></iconify-icon></button>
      </form>

      <p class="lg-note"><iconify-icon icon="lucide:info" width="16" height="16"></iconify-icon><span data-t="lg.note"></span></p>
      <a class="lg-back" href="/"><iconify-icon icon="lucide:arrow-left" width="16" height="16"></iconify-icon><span data-t="lg.back"></span></a>
    </section>

    <aside class="lg-visual" aria-hidden="true">
      <img src="/img/nasa/ca-truecolor.jpg" alt="" />
      <div class="lg-visual-txt"><b data-t="lg.v_title"></b><span data-t="lg.v_sub"></span></div>
    </aside>
  </main>

  <script src="/js/terra.js?v=25"></script>
  <script src="/js/connexion.js?v=1"></script>
</body>
</html>
