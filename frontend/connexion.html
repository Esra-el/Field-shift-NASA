<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E6E7DE" />
  <title>Field Shift — Connexion</title>
  <meta name="description" content="Connectez-vous ou créez votre compte Field Shift." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=BDO+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css?v=5" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body>
  <main class="lg">
    <section class="lg-card">
      <a class="lg-logo" href="/"><span class="lg-mark"><iconify-icon icon="lucide:sprout" width="18" height="18"></iconify-icon></span>Field Shift</a>
      <div class="lg-lang" role="group" aria-label="Langue · Language · Lingua">
        <button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button><button type="button" data-l="it">IT</button>
      </div>

      <div class="lg-body">
        <div class="lg-tabs" role="tablist">
          <button type="button" role="tab" id="tab-in" data-tab="in" aria-selected="true" data-t="au.tab_in"></button>
          <button type="button" role="tab" id="tab-up" data-tab="up" aria-selected="false" data-t="au.tab_up"></button>
        </div>

        <!-- Connexion -->
        <form class="lg-form" id="f-in" novalidate>
          <h1 data-t="au.in_title"></h1>
          <p class="lg-sub" data-t="au.in_sub"></p>
          <label><span data-t="au.phone"></span><input id="in-phone" type="tel" autocomplete="tel" inputmode="tel" required data-t-ph="au.phone_ph" /></label>
          <label><span data-t="au.pw"></span>
            <span class="lg-pw"><input id="in-pw" type="password" autocomplete="current-password" required /><button type="button" class="lg-eye" data-for="in-pw" data-t-aria="au.show"><iconify-icon icon="lucide:eye" width="18" height="18"></iconify-icon></button></span>
          </label>
          <p class="lg-err hidden" id="in-err"></p>
          <button type="submit" class="lg-btn lg-btn-full" id="in-go"><span data-t="au.in_btn"></span><iconify-icon icon="lucide:arrow-right" width="18" height="18"></iconify-icon></button>
          <p class="lg-switch"><span data-t="au.no_account"></span> <button type="button" class="lg-link" data-goto="up" data-t="au.tab_up"></button></p>
        </form>

        <!-- Inscription -->
        <form class="lg-form hidden" id="f-up" novalidate>
          <h1 data-t="au.up_title"></h1>
          <p class="lg-sub" data-t="au.up_sub"></p>
          <div class="lg-row">
            <label><span data-t="au.first"></span><input id="up-first" autocomplete="given-name" required /></label>
            <label><span data-t="au.last"></span><input id="up-last" autocomplete="family-name" required /></label>
          </div>
          <label><span data-t="au.phone"></span><input id="up-phone" type="tel" autocomplete="tel" inputmode="tel" required data-t-ph="au.phone_ph" /></label>
          <label><span data-t="au.address"></span><input id="up-addr" autocomplete="street-address" required data-t-ph="au.address_ph" /></label>
          <p class="lg-hint" id="up-region"><iconify-icon icon="lucide:map-pin" width="15" height="15"></iconify-icon><span data-t="au.addr_hint"></span></p>
          <div class="lg-row">
            <label><span data-t="au.pw"></span>
              <span class="lg-pw"><input id="up-pw" type="password" autocomplete="new-password" minlength="6" required /><button type="button" class="lg-eye" data-for="up-pw" data-t-aria="au.show"><iconify-icon icon="lucide:eye" width="18" height="18"></iconify-icon></button></span>
            </label>
            <label><span data-t="au.pw2"></span><input id="up-pw2" type="password" autocomplete="new-password" minlength="6" required /></label>
          </div>
          <label class="lg-check"><input type="checkbox" id="up-ok" required /><span data-t="au.consent"></span></label>
          <p class="lg-err hidden" id="up-err"></p>
          <button type="submit" class="lg-btn lg-btn-full" id="up-go"><span data-t="au.up_btn"></span><iconify-icon icon="lucide:arrow-right" width="18" height="18"></iconify-icon></button>
          <p class="lg-switch"><span data-t="au.have_account"></span> <button type="button" class="lg-link" data-goto="in" data-t="au.tab_in"></button></p>
        </form>

        <div class="lg-guest">
          <button type="button" class="lg-btn lg-btn-ghost lg-btn-full" id="guest-go"><iconify-icon icon="lucide:play" width="18" height="18"></iconify-icon><span data-t="au.guest"></span></button>
          <p class="lg-sub" data-t="au.guest_sub"></p>
        </div>

        <a class="lg-back" href="/"><iconify-icon icon="lucide:arrow-left" width="16" height="16"></iconify-icon><span data-t="au.back"></span></a>
      </div>
    </section>

    <aside class="lg-visual" aria-hidden="true">
      <img src="/img/nasa/ca-truecolor.jpg" alt="" />
      <div class="lg-visual-txt"><b data-t="au.v_title"></b><span data-t="au.v_sub"></span></div>
    </aside>
  </main>

  <script src="/js/terra.js?v=30"></script>
  <script src="/js/store.js"></script>
  <script src="/js/i18n-auth.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/connexion.js?v=3"></script>
</body>
</html>
