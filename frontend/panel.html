<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F1E7" />
  <title>Field Shift — Ma parcelle</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=BDO+Grotesk:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/fieldshift.css?v=1" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body data-page="dashboard">
  <div class="frame">
    <header id="topbar"></header>

    <div id="loading" class="loading"><div class="spinner"></div><p data-i18n="common.loading"></p></div>

    <main id="content" class="hidden stack">
      <!-- 1. La réponse du jour (compréhensible en quelques secondes) -->
      <section class="hero dash-hero" style="background-image:url('/img/fields.svg')">
        <div class="hero-top">
          <div style="display:flex;gap:.4rem;flex-wrap:wrap">
            <span class="badge badge-glass" id="hero-field"></span>
            <span class="badge badge-glass" id="hero-place"></span>
          </div>
          <span id="hero-stamp"></span>
        </div>
        <div class="hero-card">
          <p class="eyebrow"><iconify-icon icon="solar:calendar-mark-bold" width="18" height="18"></iconify-icon><span data-i18n="dash.today"></span> · <span id="hero-date"></span></p>
          <h1 class="verdict" id="hero-reco"></h1>
          <p id="hero-reason" data-speak></p>
          <div class="hero-actions">
            <button class="btn btn-dark" id="hero-listen"><iconify-icon icon="solar:volume-loud-bold" width="20" height="20"></iconify-icon><span data-i18n="dash.listen"></span></button>
            <a class="btn btn-light" href="/rotaciones.html"><iconify-icon icon="solar:refresh-circle-bold" width="20" height="20"></iconify-icon><span data-i18n="dash.rotations_btn"></span></a>
          </div>
        </div>
      </section>

      <!-- 2. Trois cartes : risque · eau · quand semer -->
      <div class="grid-dash">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title" data-help="risk"><span data-i18n="panel.risk"></span></h2>
            <span class="badge" id="risk-badge"></span>
          </div>
          <div class="ring-wrap">
            <div id="risk-ring"></div>
            <div class="ring-label"><div><div class="num" id="risk-score" style="font-size:3rem"></div><div class="small muted" data-i18n="dash.out_of"></div></div></div>
          </div>
          <div class="risk-scale" aria-hidden="true">
            <i class="seg low"></i><i class="seg mid"></i><i class="seg high"></i>
            <span class="marker" id="risk-marker"></span>
          </div>
          <div class="risk-scale-lbl"><span data-i18n="risk.low"></span><span data-i18n="risk.moderate"></span><span data-i18n="risk.high"></span></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title" data-help="water"><span data-i18n="panel.water"></span></h2>
            <span class="badge" id="water-status"></span>
          </div>
          <div class="water-rows">
            <div class="wrow"><span class="wlbl"><iconify-icon icon="mdi:sprout" width="20" height="20"></iconify-icon><span data-i18n="panel.need"></span></span><b id="w-need"></b></div>
            <div class="wbar"><div class="need"></div></div>
            <div class="wrow"><span class="wlbl"><iconify-icon icon="solar:waterdrops-bold" width="20" height="20"></iconify-icon><span data-i18n="panel.available"></span></span><b id="w-avail"></b></div>
            <div class="wbar"><div class="avail" id="w-bar"></div></div>
          </div>
          <div class="water-delta" id="w-delta"></div>
          <p class="small muted" id="w-explain" style="margin-top:.75rem"></p>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title" data-help="window"><span data-i18n="panel.timeline"></span></h2>
            <span class="badge" id="plant-badge"></span>
          </div>
          <p class="xs muted" data-i18n="plant.window"></p>
          <p class="num" id="plant-window" style="font-size:1.6rem;margin:.1rem 0 .8rem"></p>
          <div class="weekbar" id="cal-weeks"></div>
          <div class="cal-area" id="cal-area"></div>
          <div class="cal-axis" id="cal-axis"></div>
        </section>
      </div>

      <!-- 3. Actions principales -->
      <div class="action-row">
        <a class="btn btn-dark btn-xl" href="/rotaciones.html"><iconify-icon icon="solar:refresh-circle-bold" width="24" height="24"></iconify-icon><span data-i18n="dash.rotations_btn"></span><span class="arr"><iconify-icon icon="solar:arrow-right-linear" width="18" height="18"></iconify-icon></span></a>
        <a class="btn btn-light btn-xl" href="/copiloto.html"><iconify-icon icon="solar:chat-round-dots-bold" width="24" height="24"></iconify-icon><span data-i18n="panel.ask"></span></a>
        <a class="btn btn-light btn-xl" href="/cooperativa.html"><iconify-icon icon="solar:printer-bold" width="24" height="24"></iconify-icon><span data-i18n="panel.cooperativa"></span></a>
      </div>

      <!-- 4. Détails scientifiques (repliés par défaut) -->
      <details class="card sci" id="details">
        <summary>
          <span class="card-ico dark"><iconify-icon icon="solar:satellite-bold" width="22" height="22"></iconify-icon></span>
          <span style="flex:1"><b class="card-title" data-i18n="dash.details"></b><span class="card-sub" style="display:block" data-i18n="dash.details_sub"></span></span>
          <span class="pm"><iconify-icon icon="solar:alt-arrow-down-linear" width="22" height="22"></iconify-icon></span>
        </summary>

        <h3 class="sci-h" data-i18n="dash.indicators"></h3>
        <div class="ind-grid" id="indicators"></div>

        <div class="grid-2" style="margin-top:1.25rem">
          <div class="chart-card"><p class="small bold" data-help="rain"><span data-i18n="chart.rainfall"></span> </p><div class="chart-box"><canvas id="rain-chart"></canvas></div></div>
          <div class="chart-card"><p class="small bold" data-help="soil"><span data-i18n="chart.soil_time"></span> </p><div class="chart-box"><canvas id="soil-chart"></canvas></div></div>
          <div class="chart-card"><p class="small bold" data-help="ndvi"><span data-i18n="chart.ndvi"></span> </p><div class="chart-box"><canvas id="ndvi-chart"></canvas></div></div>
          <div class="chart-card"><p class="small bold" data-help="et"><span data-i18n="chart.climate"></span> </p><div class="chart-box"><canvas id="climate-chart"></canvas></div></div>
        </div>

        <div class="grid-2" style="margin-top:1.25rem">
          <div>
            <h3 class="sci-h" data-i18n="panel.why"></h3>
            <div id="risk-why"></div>
          </div>
          <div>
            <h3 class="sci-h" data-i18n="panel.ai"></h3>
            <p class="muted" id="ai-explain"></p>
          </div>
        </div>
      </details>
    </main>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
