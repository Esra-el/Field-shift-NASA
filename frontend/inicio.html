<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04303B" />
  <title>Field Shift — Accueil</title>
  <meta name="description" content="Décidez quoi semer avant l'arrivée de la sécheresse." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=BDO+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/css/terra.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body data-page="home">
  <header id="nav"></header>

  <section class="hero">
    <div class="stars" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="hero-copy">
        <p class="tagline"><iconify-icon icon="lucide:satellite" width="20" height="20"></iconify-icon><span data-t="tagline"></span></p>
        <h1 data-t="home.hello"></h1>
        <p class="lead" data-t="home.lead"></p>
        <div class="hero-cta">
          <a class="btn btn-light" href="/globo.html"><iconify-icon icon="lucide:scan-search" width="22" height="22"></iconify-icon><span data-t="cta.analyse"></span></a>
        </div>
        <a class="field-pill" href="/globo.html" id="field-pill">
          <iconify-icon icon="lucide:map-pin" width="16" height="16"></iconify-icon>
          <span id="field-name"></span>
          <span style="opacity:.6">·</span>
          <span id="field-crop"></span>
        </a>
      </div>
      <div class="hero-globe" id="hero-globe" aria-hidden="true"></div>
    </div>
  </section>

  <!-- 3 chiffres clés -->
  <section class="stats-strip" aria-live="polite">
    <!-- Risque : jauge en demi-cercle -->
    <article class="card sc has-bg" style="--bg:url('/img/photos/drought.jpg')">
      <header class="sc-head"><span class="sc-ic"><iconify-icon icon="lucide:sun" width="20" height="20"></iconify-icon></span><h2 data-t="stat.risk"></h2></header>
      <div class="semi">
        <svg viewBox="0 0 220 124" aria-hidden="true">
          <path class="semi-seg low" d="" id="seg-low"/><path class="semi-seg mod" d="" id="seg-mod"/><path class="semi-seg high" d="" id="seg-high"/>
          <g id="needle" class="needle" style="transform: rotate(-90deg)"><line x1="110" y1="112" x2="110" y2="40"/></g>
          <circle cx="110" cy="112" r="9" class="needle-hub"/>
        </svg>
        <div class="semi-val"><b id="s-risk">—</b><span>/100</span></div>
        <div class="semi-scale"><span>0</span><span>100</span></div>
      </div>
      <div class="sc-foot"><span class="badge" id="s-risk-badge">—</span><p class="desc" id="s-risk-d"><span class="skeleton" style="display:block;width:80%"></span></p></div>
    </article>

    <!-- Eau : besoin vs disponible -->
    <article class="card sc has-bg" style="--bg:url('/img/photos/water.jpg')" data-vivid>
      <header class="sc-head"><span class="sc-ic water"><iconify-icon icon="lucide:droplets" width="20" height="20"></iconify-icon></span><h2 data-t="stat.water"></h2></header>
      <div class="sc-big"><b id="s-water">—</b><span>%</span><small data-t="sc.covered"></small></div>
      <div class="wbar" aria-hidden="true">
        <div class="wbar-track"><span class="wbar-fill" id="s-water-bar"></span><span class="wbar-goal" id="s-water-goal"><em data-t="sc.need"></em></span></div>
      </div>
      <dl class="wbar-legend">
        <div><dt><i class="dot have"></i><span data-t="sc.have"></span></dt><dd id="s-have">—</dd></div>
        <div><dt><i class="dot need"></i><span data-t="sc.need"></span></dt><dd id="s-need">—</dd></div>
      </dl>
      <div class="sc-foot"><span class="badge" id="s-water-badge">—</span><p class="desc" id="s-water-d"></p></div>
    </article>

    <!-- Priorité de la semaine -->
    <article class="card sc focus-card has-photo" id="focus-card" style="--bg:url('/img/photos/rain.jpg')">
      <header class="sc-head"><span class="sc-ic focus"><iconify-icon id="focus-icon" icon="lucide:cloud-rain" width="20" height="20"></iconify-icon></span><h2 data-t="home.focus"></h2></header>
      <div class="focus-main">
        <p class="focus-text" id="focus-text">—</p>
        <p class="focus-why" id="focus-why"></p>
      </div>
      <div class="sc-foot">
        <span class="focus-win" id="focus-win"></span>
        <a class="btn btn-light btn-sm" href="/globo.html"><span data-t="focus.cta"></span><iconify-icon icon="lucide:arrow-right" width="18" height="18"></iconify-icon></a>
      </div>
    </article>
  </section>

  <main class="home-main home-main--full">
    <article class="card cal-card has-bg" style="--bg:url('/img/photos/rows.jpg')">
      <div class="card-head">
        <span class="card-icon"><iconify-icon icon="lucide:calendar-range" width="22" height="22"></iconify-icon></span>
        <div><h2 class="card-title" data-t="home.calendar"></h2><p class="card-sub" data-t="home.calendar_sub"></p></div>
      </div>
      <div class="cal" id="cal"><div class="skeleton" style="height:180px;border-radius:16px"></div></div>
      <div class="cal-legend" id="cal-legend"></div>
    </article>
  </main>

  <footer class="sources">
    <b data-t="home.sources"></b>
    <span>NASA GPM IMERG</span><span>SMAP</span><span>MODIS / VIIRS</span><span>NASA POWER</span>
    <span class="photo-credit" data-t="home.photos"></span>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
  <script src="/js/terra.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/assistant.js"></script>
  <script src="/js/inicio.js"></script>
</body>
</html>
