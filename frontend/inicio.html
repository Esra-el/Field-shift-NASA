<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E6E7DE" />
  <title>Field Shift — Tableau de bord</title>
  <meta name="description" content="Votre parcelle vue du satellite : risque de sécheresse, eau, végétation et conseil de semis." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=BDO+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/css/terra.css?v=25" />
  <link rel="stylesheet" href="/css/dash.css?v=11" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body data-page="home" class="dash">

  <!-- ===== Barre latérale ===== -->
  <aside class="d-side" id="d-side"></aside>

  <!-- ===== Scène : parcelle vue du satellite ===== -->
  <main class="d-main">
    <div class="d-map" id="d-map" aria-hidden="true"></div>
    <svg class="d-contours" id="d-contours" aria-hidden="true"></svg>
    <div class="d-shade" aria-hidden="true"></div>

    <header class="d-top">
      <div class="d-title">
        <a class="d-back" href="/" data-t-aria="d.back"><iconify-icon icon="lucide:arrow-left" width="20" height="20"></iconify-icon></a>
        <h1 id="d-field"></h1>
        <span class="d-coords" id="d-coords"></span>
      </div>
      <div class="d-top-cards">
        <div class="g-card d-mini"><span class="d-ring"><iconify-icon icon="lucide:cloud-rain" width="20" height="20"></iconify-icon></span><div><small data-t="d.rain16"></small><b id="d-rain16">—</b></div></div>
        <div class="g-card d-mini"><span class="d-ring"><iconify-icon icon="lucide:flag" width="20" height="20"></iconify-icon></span><div><small data-t="d.location"></small><b id="d-place">—</b></div></div>
      </div>
    </header>

    <div class="d-ctrls">
      <button type="button" class="d-ctrl" id="d-full" data-t-aria="d.full"><iconify-icon icon="lucide:scan" width="18" height="18"></iconify-icon></button>
      <button type="button" class="d-ctrl" id="d-zin" aria-label="+"><iconify-icon icon="lucide:plus" width="18" height="18"></iconify-icon></button>
      <button type="button" class="d-ctrl" id="d-zout" aria-label="−"><iconify-icon icon="lucide:minus" width="18" height="18"></iconify-icon></button>
    </div>

    <section class="d-left">
      <div class="d-stats">
        <div class="g-card d-stat"><span class="d-ring"><iconify-icon icon="lucide:sun" width="20" height="20"></iconify-icon></span><div><small data-t="d.risk"></small><b><span id="d-risk">—</span><em>/100</em></b></div></div>
        <div class="g-card d-stat"><span class="d-ring"><iconify-icon icon="lucide:activity" width="20" height="20"></iconify-icon></span><div><small data-t="d.ndvi"></small><b id="d-ndvi">—</b></div></div>
        <div class="g-card d-stat"><span class="d-ring"><iconify-icon icon="lucide:droplet" width="20" height="20"></iconify-icon></span><div><small data-t="d.soil"></small><b><span id="d-soil">—</span><em>%</em></b></div></div>
      </div>

      <div class="d-crop">
        <div class="d-crop-main">
          <div class="d-crop-img" id="d-crop-img"></div>
          <div class="d-crop-val">
            <span class="d-pill" id="d-water-pill"></span>
            <b><span id="d-water">—</span><em>%</em></b>
            <small data-t="d.water_cov"></small>
          </div>
        </div>
        <div class="d-crop-grid" id="d-crop-grid"></div>
      </div>
    </section>

    <section class="d-advice">
      <p class="d-advice-txt" id="d-advice"></p>
      <a class="d-btn-lime" href="/globo.html" data-t="d.details"></a>
    </section>

    <form class="d-ask" id="d-ask" autocomplete="off">
      <span class="d-ask-ic"><iconify-icon icon="lucide:sparkle" width="18" height="18"></iconify-icon></span>
      <input id="d-ask-in" data-t-ph="d.ask_ph" />
      <button type="submit" class="d-send" data-t-aria="d.send"><iconify-icon icon="lucide:send" width="18" height="18"></iconify-icon></button>
      <button type="button" class="d-mic" id="d-mic" data-t-aria="d.mic"><iconify-icon icon="lucide:mic" width="18" height="18"></iconify-icon></button>
    </form>

    <!-- ===== Trois panneaux du bas ===== -->
    <section class="d-bottom">
      <article class="d-panel">
        <header class="d-ph">
          <div><h2 data-t="d.signals"></h2><small data-t="d.this_week"></small></div>
          <div class="d-tabs" id="sig-tabs"><button type="button" class="on" data-v="now" data-t="d.tab_now"></button><button type="button" data-v="norm" data-t="d.tab_norm"></button></div>
        </header>
        <div class="d-bars" id="d-bars"></div>
      </article>

      <article class="d-panel d-panel-dark">
        <header class="d-ph">
          <h2 data-t="d.veg"></h2>
          <a class="d-arrow" href="/globo.html" data-t-aria="d.details"><iconify-icon icon="lucide:arrow-up-right" width="18" height="18"></iconify-icon></a>
        </header>
        <div class="d-circles" id="d-circles"></div>
      </article>

      <article class="d-panel">
        <header class="d-ph">
          <div><h2 id="ch-title" data-t="d.soil_chart"></h2><small id="ch-sub" data-t="d.8w"></small></div>
          <div class="d-tabs" id="ch-tabs"><button type="button" class="on" data-v="soil" data-t="d.tab_8w"></button><button type="button" data-v="rain" data-t="d.tab_16d"></button></div>
        </header>
        <div class="d-chart" id="d-chart"></div>
      </article>
    </section>

    <span class="d-credit" data-t="d.credit"></span>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
  <script src="/js/terra.js?v=25"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/i18n-auth.js?v=1"></script>
  <script src="/js/auth.js?v=1"></script>
  <script src="/js/assistant.js"></script>
  <script src="/js/side.js?v=3"></script>
  <script src="/js/inicio.js?v=28"></script>
</body>
</html>
