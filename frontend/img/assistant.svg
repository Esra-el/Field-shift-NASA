  <rect x="60" y="70" width="210" height="84" rx="26" fill="#1E4D2B"/>
  <path d="M100 154 l0 26 l26 -26Z" fill="#1E4D2B"/>
  <rect x="88" y="98" width="120" height="10" rx="5" fill="#CDE8F6"/><rect x="88" y="118" width="80" height="10" rx="5" fill="#CDE8F6" opacity=".6"/>
  <rect x="360" y="190" width="170" height="70" rx="24" fill="#FFFFFF" stroke="#1E4D2B" stroke-width="3"/>
  <path d="M500 260 l0 22 l-22 -22Z" fill="#FFFFFF" stroke="#1E4D2B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="384" y="214" width="96" height="9" rx="4.5" fill="#1E4D2B"/><rect x="384" y="232" width="60" height="9" rx="4.5" fill="#7A4E2D" opacity=".6"/>
  <!-- Satellite -->
  <g transform="translate(470 80) rotate(-25)">
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#1E4D2B"/>
    <rect x="-70" y="-10" width="44" height="20" rx="3" fill="#2B78B6"/><rect x="26" y="-10" width="44" height="20" rx="3" fill="#2B78B6"/>
    <path d="M-26 0 h8 M18 0 h8" stroke="#1E4D2B" stroke-width="4"/>
