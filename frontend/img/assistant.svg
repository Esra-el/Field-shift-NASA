  <circle cx="470" cy="90" r="160" fill="#CDE8F6"/>
  <path d="M0 330 C 120 300, 240 320, 340 300 S 520 280, 600 300 L600 420 L0 420Z" fill="#EADFCB"/>
  <path d="M0 360 C 140 340, 260 360, 380 345 S 540 330, 600 345 L600 420 L0 420Z" fill="#D8C7A4"/>
  <!-- Pousse -->
  <path d="M300 345 C 300 300, 300 270, 300 230" stroke="#1E4D2B" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M300 270 C 250 270, 225 240, 220 205 C 262 205, 294 230, 300 270Z" fill="#3E8E41"/>
  <path d="M300 245 C 350 245, 378 214, 384 176 C 338 176, 304 204, 300 245Z" fill="#2F6B3A"/>
