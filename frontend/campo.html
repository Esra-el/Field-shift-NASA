<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F1E7" />
  <title>Field Shift — Ma parcelle</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=BDO+Grotesk:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="stylesheet" href="/css/fieldshift.css?v=1" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body data-page="map">
  <div class="frame">
    <header id="topbar"></header>

    <div class="page-head">
      <div><h1 data-i18n="field.title"></h1><p class="sub" data-i18n="field.sub"></p></div>
      <span class="stepper" id="steps" style="background:var(--surface);box-shadow:var(--shadow-sm)"></span>
    </div>

    <form class="search-bar" id="search-form" role="search">
      <iconify-icon icon="solar:magnifer-linear" width="22" height="22" aria-hidden="true"></iconify-icon>
      <input id="search-q" class="input" type="search" autocomplete="off" data-i18n-ph="field.search_ph" aria-label="Buscar" />
      <button class="btn btn-dark" type="submit"><span data-i18n="field.search"></span></button>
      <button class="btn btn-light" type="button" id="locate-btn"><iconify-icon icon="solar:gps-bold" width="20" height="20"></iconify-icon><span class="hide-sm" data-i18n="field.locate"></span></button>
      <div class="search-results hidden" id="search-results" role="listbox"></div>
    </form>

    <div class="grid-dash" style="align-items:start">
      <section class="card map-card span-2" style="position:relative">
        <div id="map"></div>
        <div class="map-tools">
          <div class="seg" id="base-seg">
            <button data-base="plan" data-i18n="map.plan"></button>
            <button data-base="sat" class="is-active" data-i18n="map.sat"></button>
          </div>
        </div>
      </section>

      <section class="card sticky">
        <div class="card-head">
          <div class="title-row">
            <span class="card-ico green"><iconify-icon icon="solar:map-point-bold" width="22" height="22"></iconify-icon></span>
            <div><h2 class="card-title" data-i18n="field.selected"></h2><p class="card-sub" id="coords" data-i18n="field.none"></p></div>
          </div>
          <span class="badge badge-gray" id="mode-badge">—</span>
        </div>

        <div class="kv-tiles">
          <div class="tile"><span class="t-label"><iconify-icon icon="solar:global-linear" width="14" height="14"></iconify-icon><span data-i18n="field.lat"></span></span><div class="t-value" id="t-lat">—</div></div>
          <div class="tile"><span class="t-label"><iconify-icon icon="solar:global-linear" width="14" height="14"></iconify-icon><span data-i18n="field.lon"></span></span><div class="t-value" id="t-lon">—</div></div>
          <div class="tile wide" id="t-area-tile"><span class="t-label"><iconify-icon icon="solar:ruler-angular-linear" width="14" height="14"></iconify-icon><span data-i18n="field.area"></span></span><div class="t-value" id="t-area">—</div></div>
        </div>
        <p class="small muted hidden" id="area"></p>

        <div class="wb-box" style="display:flex;gap:10px;margin-top:14px">
          <iconify-icon icon="solar:info-circle-linear" width="18" height="18" style="flex-shrink:0;color:var(--ink-3);margin-top:1px"></iconify-icon>
          <p class="small muted" data-i18n="field.draw_hint"></p>
        </div>

        <a href="/perfil.html" class="btn btn-dark btn-block" id="use-btn" style="margin-top:16px">
          <iconify-icon icon="solar:satellite-bold" width="20" height="20"></iconify-icon><span data-i18n="field.use"></span>
        </a>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/campo.js"></script>
</body>
</html>
